<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Imaginator</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>

<section id="launcher" class="view">
  <h1>🎨 Imaginator</h1>
  <div class="cards">
    <button class="card" data-view="toddler">
      <span class="card-icon">🖍️</span>
      <span>Little artists</span>
    </button>
    <button class="card" data-view="kids">
      <span class="card-icon">🌈</span>
      <span>Big artists</span>
    </button>
    <button class="card" data-view="artist">
      <span class="card-icon">✨</span>
      <span>Super artists</span>
    </button>
    <button class="card" data-view="gallery">
      <span class="card-icon">🖼️</span>
      <span>Gallery</span>
    </button>
  </div>
  <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
</section>

<section id="toddler" class="view hidden">
  <div class="rail" id="toddler-colors"></div>
  <div class="canvas-wrap"><canvas id="toddler-canvas"></canvas></div>
  <button class="home-btn" data-home title="Hold to go home">⌂</button>
  <div class="toast" id="toddler-toast">⭐</div>
</section>

<section id="kids" class="view hidden">
  <div class="rail kids-rail">
    <div id="kids-swatch" title="Current color"></div>
    <div id="hue-bar"><div id="hue-thumb"></div></div>
    <div class="chips">
      <button class="chip" data-color="#000000" style="background:#000000"></button>
      <button class="chip" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="chip" data-color="#8d5524" style="background:#8d5524"></button>
    </div>
    <div class="sizes">
      <button class="size-btn" data-size="6"><span class="size-dot" style="width:8px;height:8px"></span></button>
      <button class="size-btn active" data-size="14"><span class="size-dot" style="width:16px;height:16px"></span></button>
      <button class="size-btn" data-size="30"><span class="size-dot" style="width:26px;height:26px"></span></button>
    </div>
    <button id="eraser-btn" class="tool-btn" title="Eraser">🧽</button>
    <button id="undo-btn" class="tool-btn" title="Undo">↩</button>
    <button id="clear-btn" class="tool-btn hold-btn" title="Hold to clear">🗑</button>
  </div>
  <div class="canvas-wrap"><canvas id="kids-canvas"></canvas></div>
  <button class="home-btn" data-home title="Hold to go home">⌂</button>
  <div class="toast" id="kids-toast">⭐</div>
</section>

<section id="artist" class="view hidden">
  <div class="rail artist-rail">
    <div id="artist-swatch" class="swatch" title="Current color"></div>
    <div class="color-bars">
      <div id="artist-hue" class="vbar hue-gradient"><div id="artist-hue-thumb" class="vbar-thumb"></div></div>
      <div id="artist-light" class="vbar"><div id="artist-light-thumb" class="vbar-thumb"></div></div>
    </div>
    <div class="sizes">
      <button class="size-btn" data-size="6"><span class="size-dot" style="width:8px;height:8px"></span></button>
      <button class="size-btn active" data-size="14"><span class="size-dot" style="width:16px;height:16px"></span></button>
      <button class="size-btn" data-size="30"><span class="size-dot" style="width:26px;height:26px"></span></button>
    </div>
    <div class="tool-grid">
      <button id="a-brush" class="tool-btn small active" title="Brush">🖌</button>
      <button id="a-rainbow" class="tool-btn small" title="Rainbow brush">🌈</button>
      <button id="a-spray" class="tool-btn small" title="Spray">💨</button>
      <button id="a-stamp" class="tool-btn small" title="Stamps">🦄</button>
      <button id="a-eraser" class="tool-btn small" title="Eraser">🧽</button>
      <button id="a-mirror" class="tool-btn small" title="Mirror mode">🦋<span id="a-mirror-badge" class="badge"></span></button>
      <button id="a-undo" class="tool-btn small" title="Undo">↩</button>
      <button id="a-redo" class="tool-btn small" title="Redo">↪</button>
      <button id="a-clear" class="tool-btn small hold-btn" title="Hold to clear">🗑</button>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="artist-canvas"></canvas>
    <div id="stamp-panel" class="hidden"></div>
  </div>
  <button class="home-btn" data-home title="Hold to go home">⌂</button>
  <div class="toast" id="artist-toast">⭐</div>
</section>

<section id="gallery" class="view hidden">
  <header class="gallery-header">
    <button id="gallery-back" title="Back">←</button>
    <h2>🖼️ Gallery</h2>
    <button id="gallery-download-all" class="hidden" title="Download all drawings as ZIP">⬇ Save all</button>
  </header>
  <div class="grid" id="gallery-grid"></div>
  <p id="gallery-empty" class="hidden">No drawings yet — go make some!</p>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
